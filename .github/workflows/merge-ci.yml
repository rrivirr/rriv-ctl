name: Semantic release

on:
  push:
    branches:
      - main
      - alpha
      - beta

env:
  project-directory: ./

jobs:
  release:
    name: Release and Build
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.next-version.outputs.new-release-published }}
      new-release-version: ${{ steps.next-version.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.next-version.outputs.new-release-git-tag }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - run: npm i -g semantic-release @semantic-release/{git,changelog}
      - run: semantic-release
        id: next-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: Publish binaries
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.new-release-git-tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-access-key-id: ${{ secrets.SPACES_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SPACES_SECRET_KEY }}
          aws-region: us-east-1

      - name: Download JSON from S3
        run: aws s3api get-object --bucket rriv-envs --output json --key prod.json --endpoint-url ${{ secrets.SPACES_ENDPOINT }} ./config.json

      - name: JSON to variables
        uses: laingcc/json-to-variables@release
        with:
          filename: "./config.json"
          masked: true

      - name: Build binaries
        run: npm run binary
        env:
          RRIV_API_URL: ${{ env.RRIV_API_URL }}
          KEYCLOAK_URL: ${{ env.KEYCLOAK_URL }}
          KEYCLOAK_CLIENT_ID: ${{ env.KEYCLOAK_CLIENT_ID }}
          DATA_API_URL: ${{ env.DATA_API_URL }}

      - name: move installer
        run: cp rrivctl-installer.sh apps/

      - name: Upload binaries
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: apps/*
          tag: ${{ needs.release.outputs.new-release-git-tag }}
          overwrite: true
