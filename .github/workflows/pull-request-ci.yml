name: pull-request-ci

on:
  pull_request:
    branches:
      - main

env:
  project-directory: ./

jobs:
  build:
    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: configure LTS node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: npm clean install
        run: npm ci

      - name: run ESLint
        run: npm run lint

      # - name: run test
      #   run: npm test
